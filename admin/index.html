<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - XAM Goth Apparel</title>

    <!-- ===== FAVICON ===== -->
    <link rel="icon" type="image/png" href="../assets/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
    <link rel="shortcut icon" href="../assets/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="XAM Store" />
    <link rel="manifest" href="../assets/images/site.webmanifest" />
    <!-- =================== -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000; /* Negro absoluto */
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            padding: 20px;
        }
        .admin-container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .admin-logo {
            margin-bottom: 2rem;
        }
        .admin-logo img {
            height: 160px;
            width: 160px;
            object-fit: contain;
            margin-bottom: 1rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .admin-logo img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.08);
        }
        .admin-logo h1 {
            font-family: 'Uncial Antiqua', cursive;
            font-size: 2.5rem;
            letter-spacing: 4px;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }
        .admin-logo p {
            color: #666666;
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 1px;
        }
        .admin-divider {
            width: 80px;
            height: 2px;
            background: #1a1a1a;
            margin: 1.5rem auto;
        }
        .admin-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }
        .admin-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            border: 2px solid #1a1a1a;
            border-radius: 12px;
            background: transparent;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .admin-btn:hover {
            border-color: #ffffff;
            background: #ffffff;
            color: #000000;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255,255,255,0.05);
        }
        .admin-btn i {
            font-size: 1.5rem;
        }
        .admin-btn-primary {
            border-color: #222;
        }
        .admin-btn-primary:hover {
            border-color: #ffffff;
            background: #ffffff;
            color: #000000;
        }
        .admin-btn-secondary {
            border-color: #1a1a1a;
        }
        .admin-btn-secondary:hover {
            border-color: #666;
            background: transparent;
            color: #ffffff;
        }
        .admin-footer {
            margin-top: 2.5rem;
            color: #333;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }
        .admin-footer a {
            color: #555;
            text-decoration: none;
            transition: color 0.3s;
        }
        .admin-footer a:hover {
            color: #ffffff;
        }
        .icon-cms {
            font-size: 1.6rem;
        }
        .icon-analytics {
            font-size: 1.6rem;
        }
        @media (max-width: 480px) {
            .admin-logo h1 {
                font-size: 1.8rem;
            }
            .admin-btn {
                font-size: 0.95rem;
                padding: 0.8rem 1.5rem;
            }
            .admin-logo img {
                height: 60px;
                width: 60px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
          <!-- Logo y título -->
        <div class="admin-logo">
            <img src="../assets/images/logo_blanco.png" alt="XAM Goth Apparel">
            <h1>XAM</h1>
            <p>Panel de Administración</p>
        </div>
        
        <div class="admin-divider"></div>
        
        <!-- Botones -->
        <div class="admin-buttons">
            <!-- Botón 1: Gestionar Productos (Pages CMS) -->
            <a href="https://app.pagescms.org/xam-goth-apparel/store/master/file/productos" target="_blank" class="admin-btn admin-btn-primary">
                <span class="icon-cms">📦</span>
                Gestionar Productos
                <span style="font-size: 0.7rem; color: #666; margin-left: auto;">→</span>
            </a>
            
            <!-- Botón 2: Google Analytics -->
            <a href="https://analytics.google.com/analytics/web/provision/#/a407080821p552975748/reports/intelligenthome" target="_blank" class="admin-btn admin-btn-secondary">
                <span class="icon-analytics">📊</span>
                Ver Google Analytics
                <span style="font-size: 0.7rem; color: #666; margin-left: auto;">→</span>
            </a>
        </div>
        
        <!-- Footer -->
        <div class="admin-footer">
            <p>© 2026 XAM Goth Apparel · <a href="https://xam-goth-apparel.github.io/store/">Volver a la tienda</a></p>
        </div>
    </div>
</body>
</html>
